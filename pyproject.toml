[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spur"
version = "0.1.0"
description = "Parametric involute spur gear generator: web UI, HTTP API and CLI with STL/STEP export"
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = ["gear", "involute", "cad", "cadquery", "stl", "step", "3d-printing"]
dependencies = [
    "cadquery>=2.5",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.14",
    "mypy>=1.18",
    "import-linter>=2.3",
    "pre-commit>=4",
    "pytest-xdist>=3.8",
    "pytest-cov>=7.1",
    "playwright==1.63.0",
]

[project.scripts]
spur = "spur.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spur"]

# --- the gate: lint, types, import boundaries, tests. `make verify` runs all four. ----

[tool.ruff]
target-version = "py312"   # one supported interpreter (L23); cadquery-ocp has no wheels past 3.12
line-length = 100          # the widest line already in the tree is 99

# `ruff format` is deliberately not part of this project -- see L16. It would rewrite 10
# files and 648 lines, flattening comment alignment and continuation layout that was set
# by hand to make the geometry readable. The linter below still enforces line length and
# whitespace; the arrangement inside that is a human decision here.

[tool.ruff.lint]
# High-signal set, not "ALL": ALL churns between ruff releases and turns review into
# bikeshedding. No D/DOC (module and function docstrings here are prose, not a schema),
# no ANN (mypy strict already demands annotations).
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # import sorting
    "N",             # naming
    "UP",            # modern syntax for the lowest supported Python
    "B",             # bugbear: real bugs, not style
    "SIM",           # simplifications
    "C4",            # comprehensions
    "PTH",           # pathlib over os.path
    "TID",           # tidy imports
    "ARG",           # unused arguments
    "ERA",           # commented-out code
    "TRY",           # exception antipatterns
    "LOG", "G",      # logging correctness
    "PT",            # pytest style
    "RUF",           # ruff's own, including RUF100: an unused noqa is an error
]
# A bare `# noqa` is itself a violation -- suppress one rule, by code, or not at all.
ignore = [
    # TRY003 wants long messages moved into exception classes. This project's error
    # messages are the product: they name the offending parameter and say what to
    # change ("D-flat must be between 4.5 and 9 mm"). A class per message would make
    # them worse, not better. The rest of TRY stays on. See L15.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Tests name their fixtures and parametrised cases for the reader, not for a linter.
"tests/*" = ["ARG001"]

[tool.mypy]
# 3.12: numpy's bundled stubs use `type` statements and mypy refuses to read them below
# 3.12. 3.12 is also the only supported runtime now (L23), so the type checker's version
# is the runtime's -- there is no lower floor left for it to miss.
python_version = "3.12"
plugins = ["pydantic.mypy"]   # without it mypy cannot see the generated model __init__
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
disallow_any_explicit = true
# On, for everything mypy checks (src tests docker bench scripts), with no per-module
# exception -- a carve-out would be a second ratchet, the shape L21 retires. `Any` is
# not written in this codebase: a genuinely untyped value is `object`, and a value a
# library already names keeps the library's own alias (pydantic's JsonSchemaValue,
# starlette's Message). See L21 (supersedes L14).

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
# Without these, the pydantic mypy plugin writes an explicit `Any` into the
# initialiser it generates for every model and reports it on the model's own `class`
# line -- confirmed by a hand-run `mypy --disallow-any-explicit` before this fix:
# exactly six errors, one per model (GearParams, DerivedDimensions, InfoQuery,
# ModelQuery, PoolState, HealthReport), see 04-02-SUMMARY.md. With both settings the
# generated initialiser is typed from the fields and none remain. Trade-off (R-1,
# L21): every model constructor call is now type-checked against its fields. Static
# only -- no model gains extra="forbid", so runtime handling of unknown fields is
# unchanged.

[[tool.mypy.overrides]]
# OCP, the OpenCascade binding, ships no type information (no .pyi and no py.typed in
# cadquery-ocp 7.9.3.1.1), so the entry is scoped to it -- never a global
# ignore_missing_imports, which would blind the whole project. cadquery 2.8.0, the pinned
# version, ships py.typed (earlier releases in the declared >=2.5 range unchecked): mypy
# reads its annotations (which is why Shape.cut -> Shape reached the gate), so it needs
# no entry (Phase 16, D-04).
module = ["OCP.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
xfail_strict = true
# Dump-only: faulthandler prints every thread's stack when one test item runs past 170 s
# and the run carries on (no exit on timeout until a first captured hang). The timer is
# per test item, so a stall after a worker's last test is not covered (the hang item's
# runbook). Sized at twice the slowest phase of CI's first --durations reading (83.55 s,
# tests/test_model.py::test_the_default_gear_asked_for_the_hob_root_builds_the_oracle_s_root,
# run 38750065494, ubuntu-latest, -n 4, 2026-10-15) rounded up to 10 s. The local reading
# (32.33 s on an Apple M5 Max, a different slowest test) had set 120 (D-07, 26-07).
faulthandler_timeout = 170
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx`",
]

[tool.coverage.run]
branch = true
source = ["src/spur"]
# BuildPool's workers are spawned processes (pool.py:35) and pytest-cov 7 dropped its
# subprocess hook, so "multiprocessing" is what makes coverage measure them. "thread"
# must be listed too: setting the key replaces coverage's default, and without it the
# lifespan thread that builds and shuts down the pool stops being traced (pool.py read
# 85 % that way, 15-RESEARCH Pitfall 2). "parallel" writes one data file per process for
# pytest-cov to combine; "sigterm" saves the data of a worker pool.py terminates -- a
# guard, since no test terminates a worker inside src/spur today (15-RESEARCH Code
# Example 5).
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.report]
# The floor, read by `make test`'s --cov and nowhere else (pytest-cov copies this value
# when --cov-fail-under is absent): 96 = floor(L - max(0.25, S)) with L = 96.99 (the serial
# baseline, the lowest of four totals), S = 0.00 (the spread of three -n 8 totals at
# 97.21) -- bench/RESULTS.md "The gate, measured and pinned (Phase 15)", Coverage floor,
# measured 2026-10-04, D-10's rule. Re-measure the same way before moving it.
fail_under = 96
# fail_under compares the total rounded to `precision`; the default 0 let a 45.93 % total
# pass a floor of 46 (15-RESEARCH Pitfall 3).
precision = 2

[tool.importlinter]
root_package = "spur"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The app never imports its own tests"
type = "forbidden"
source_modules = ["spur"]
forbidden_modules = ["tests"]

[[tool.importlinter.contracts]]
name = "The gear maths stays free of the CAD kernel"
# calc.py runs on every keystroke in the UI. It is pure arithmetic on purpose: the
# moment it can reach OpenCascade, that property is gone and nobody notices until the
# form goes slow. model.py is the only module allowed to touch the kernel. spur.app used
# to be listed here too, with allow_indirect_imports = true; its own, stricter rule now
# lives in "The serving process never imports the CAD kernel" below -- forbidding
# indirectly subsumes forbidding directly, so keeping both here would just be two
# overlapping rules for the same module.
type = "forbidden"
source_modules = ["spur.calc", "spur.params", "spur.cli"]
forbidden_modules = ["cadquery", "OCP"]
# Reaching the kernel *through* model.py is the whole point; only a direct import here
# is the violation.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The CLI does not inherit web-serving policy"
# Admission control (the bounded build queue) is a property of serving HTTP, not of
# building a gear -- see L04. A CLI export must never queue behind anything.
type = "forbidden"
source_modules = ["spur.cli"]
forbidden_modules = ["spur.app", "fastapi", "starlette"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The gear maths stays free of the logger"
# calc.py runs on every keystroke in the UI and must stay pure arithmetic, the same
# reason it must stay free of the CAD kernel above -- a logging import would mean this
# module can raise from formatting/handler I/O, or silently drift its own state (D-17).
# tests/test_records.py's test_calc_module_stays_log_free is a regex-based belt on the
# same claim; this contract is the suspenders, the way the CAD-kernel boundary above
# already has both.
type = "forbidden"
source_modules = ["spur.calc"]
forbidden_modules = ["spur.records", "logging"]

[[tool.importlinter.contracts]]
name = "The serving process never imports the CAD kernel"
# app.py stops importing model.py under D-02: builds happen in worker processes only,
# reached through spur.pool's runtime importlib call, never a static import. The
# serving process's memory must never contain OpenCascade, so a transitive path is as
# bad as a direct one -- allow_indirect_imports = false is what makes mem_limit a
# number about a kernel-free parent plus N workers, rather than a guess.
type = "forbidden"
source_modules = ["spur.app"]
forbidden_modules = ["cadquery", "OCP"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "The shaft maths stays free of the CAD kernel and the solid"
# The shaft numbers run on every keystroke like calc.py's, so the same property has to
# hold: pure arithmetic, nothing that can reach OpenCascade. The gear's version of this
# rule allows indirect imports; this one does not, so the shaft maths cannot reach the
# kernel even through params or model, which the human accepted as the stricter form
# (D-14). shaft_model is listed as forbidden because it is the shaft's doorway to the
# kernel. tests/test_seam.py's test_the_shaft_maths_imports_no_kernel_no_solid_no_logger_and_no_gear_maths
# is the regex belt for this claim.
type = "forbidden"
source_modules = ["spur.shaft_params", "spur.shaft_calc", "spur.din5480", "spur.din5480_tables"]
forbidden_modules = ["cadquery", "OCP", "spur.model", "spur.shaft_model"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "The shaft maths stays free of the logger"
# Same reason as the gear's logger contract above: a logging import would let pure
# arithmetic raise from handler I/O. No allow_indirect_imports key, so import-linter's
# default applies, which is false (importlinter/contracts/forbidden.py, 2.15): indirect
# imports are forbidden here too. Belt: the same test as the contract above.
type = "forbidden"
source_modules = ["spur.shaft_params", "spur.shaft_calc", "spur.din5480", "spur.din5480_tables"]
forbidden_modules = ["spur.records", "logging"]

[[tool.importlinter.contracts]]
name = "The kernel doorways are model and shaft_model"
# One doorway to the solid stays true in the module graph once a second kernel module
# exists: nothing that serves, logs or lists parts may import shaft_model. pool reaches
# model by an importlib string the linter does not see (pool.py), so that path stays as
# it is. Belt: tests/test_seam.py's test_only_model_may_import_the_shaft_solid.
#
# Handoff to Phase 32: when model.py first imports shaft_model statically, this contract
# breaks through cli -> model -> shaft_model (measured in 30-RESEARCH Pitfall 4). That
# same commit adds ignore_imports = ["spur.model -> spur.shaft_model"] to this contract;
# added any earlier, import-linter errors with "No matches for ignored import".
type = "forbidden"
source_modules = ["spur.app", "spur.cli", "spur.pool", "spur.records", "spur.parts"]
forbidden_modules = ["spur.shaft_model"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "The gear maths does not know the shaft"
# The structural half of "every gear link builds the same part": gear numbers must not
# move because shaft code did, and a gear module that cannot name a shaft module cannot
# depend on one. parts is listed because it will name ShaftParams from Phase 31. Belt:
# tests/test_seam.py's test_the_gear_maths_imports_no_shaft_module.
type = "forbidden"
source_modules = ["spur.calc", "spur.params"]
forbidden_modules = ["spur.shaft_params", "spur.shaft_calc", "spur.din5480",
                     "spur.din5480_tables", "spur.shaft_model", "spur.parts"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "The shaft maths copies the gear maths, never imports it"
# REQUIREMENTS REQ-shaft-routes-separate and the roadmap's Phase 30 criterion 3 say the
# shaft maths imports no gear maths, and the four contracts above do not say it. Phase 31
# copies calc.py's patterns and never imports out of it (the _involute_angle precedent),
# so gear and shaft numbers stay uncoupled. Direct imports only, with the key set
# explicitly because import-linter's default is false: shaft_params is expected to import
# spur.params, and params imports calc inside its validators (params.py), which makes
# calc an indirect import of the shaft maths by design. Belt: the same test as the first
# shaft contract.
type = "forbidden"
source_modules = ["spur.shaft_params", "spur.shaft_calc", "spur.din5480", "spur.din5480_tables"]
forbidden_modules = ["spur.calc"]
allow_indirect_imports = true
