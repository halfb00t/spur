name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The same gate a developer runs locally and `make worktree.land` runs before a
      # merge: ruff, mypy --strict, the import-boundary contracts, the unfinished-work
      # scan and the tests. One definition of "passing", enforced in three places.
      - run: make verify PYTHON=python

  vendor-bundle:
    # The committed three.js bundle must stay reproducible from web/, or nobody can
    # tell what is in the 568 KB blob the browser executes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: bundle matches web/
        run: git diff --exit-code -- src/spur/static/vendor

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The build runs docker/smoke.py, so a broken dependency closure fails here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: spur:ci
      - name: the packaged entrypoint serves a gear
        run: |
          docker run -d --name spur -p 8000:8000 spur:ci
          for _ in $(seq 60); do curl -sf localhost:8000/api/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8000/api/health
          curl -sfo /dev/null 'localhost:8000/api/model.stl?quality=preview'
          curl -sfo /dev/null 'localhost:8000/api/model.step'
          docker rm -f spur
