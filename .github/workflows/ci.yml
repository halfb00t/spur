name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every job below is required green on a PR head by `make pr.land` (D-05, L22) -- the
# exact list is `.github/workflows/required-jobs.txt`, next to this file. Change both
# together; tests/test_pr_land.py fails when they disagree.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The same gate the pre-push hook runs and `make worktree.land` runs before a
      # merge: ruff, mypy --strict, the import-boundary contracts, the unfinished-work
      # scan and the tests. One definition of "passing", enforced in three places (L13,
      # L36). Here `make verify` also runs `pre-commit install` once, through the
      # Makefile's `$(HOOKS)` stamp; none is expected to fire in CI (L36 A1, open until
      # the phase's first CI run is read).
      #
      # The kernel pair the regression fixture was captured on (cadquery 2.8.0 /
      # cadquery-ocp 7.9.3.1.1) is pinned here: requirements.txt, the L12 closure the
      # image installs, doubles as a pip constraints file for every install `make verify`
      # runs inside `$(STAMP)`, so a fresh resolve cannot move the kernel under the
      # fixture. docker/refresh-requirements.sh moves the pin; `make fixture.regen` moves
      # the fixture; test_the_fixture_was_captured_on_the_kernel_this_run_uses names any
      # mismatch (L34). A relative path works: make runs in the repo root.
      - run: make verify PYTHON=python
        env:
          PIP_CONSTRAINT: requirements.txt
      # `.venv` exists only once make verify has made it; `if: always()` keeps the pair
      # in the log of a red run too.
      - name: kernel pair this run resolved
        if: always()
        run: >-
          .venv/bin/python -c "from importlib.metadata import version;
          print('cadquery', version('cadquery'), 'cadquery-ocp', version('cadquery-ocp'))"

  vendor-bundle:
    # The committed three.js bundle must stay reproducible from web/, or nobody can
    # tell what is in the 568 KB blob the browser executes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: bundle matches web/
        run: git diff --exit-code -- src/spur/static/vendor

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The build runs docker/smoke.py, so a broken dependency closure fails here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: spur:ci
      - name: the packaged entrypoint serves a gear
        run: |
          docker run -d --name spur -p 8000:8000 spur:ci
          for _ in $(seq 60); do curl -sf localhost:8000/api/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8000/api/health
          curl -sfo /dev/null 'localhost:8000/api/model.stl?quality=preview'
          curl -sfo /dev/null 'localhost:8000/api/model.step'
          docker rm -f spur
